<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter Status</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading account data...</p>
    </div>
    <div id="error" class="error" style="display:none">
      <div class="error-icon">⚠️</div>
      <p id="error-message">Not logged in to OpenRouter</p>
      <button id="retry-btn" class="btn" onclick="loadData()">Retry</button>
    </div>
    <div id="content" style="display:none">
      <!-- Header -->
      <div class="header">
        <img id="avatar" class="avatar" src="" alt="avatar">
        <div class="header-info">
          <h1 id="user-name" class="user-name">-</h1>
          <p id="user-email" class="user-email">-</p>
        </div>
      </div>

      <!-- Balance Card -->
      <div class="card balance-card">
        <div class="card-label">Balance</div>
        <div class="card-value" id="balance">-</div>
      </div>

      <!-- Usage Cards -->
      <div class="cards-row">
        <div class="card mini-card period-card" data-period="day">
          <div class="card-label">Today</div>
          <div class="card-value mini" id="usage-daily">-</div>
        </div>
        <div class="card mini-card period-card" data-period="week">
          <div class="card-label">This Week</div>
          <div class="card-value mini" id="usage-weekly">-</div>
        </div>
        <div class="card mini-card period-card" data-period="month">
          <div class="card-label">This Month</div>
          <div class="card-value mini" id="usage-monthly">-</div>
        </div>
      </div>

      <!-- Quick Period Cards -->
      <div class="cards-row">
        <div class="card mini-card period-card active" data-period="15m">
          <div class="card-label">15 min</div>
          <div class="card-value mini" id="usage-15m">-</div>
        </div>
        <div class="card mini-card period-card" data-period="1h">
          <div class="card-label">1 hour</div>
          <div class="card-value mini" id="usage-1h">-</div>
        </div>
        <div class="card mini-card period-card" data-period="3h">
          <div class="card-label">3 hours</div>
          <div class="card-value mini" id="usage-3h">-</div>
        </div>
      </div>

      <!-- Usage by Model -->
      <div class="card">
        <div class="card-header">
          <span class="card-label" id="chart-title">Usage by Model (15 min)</span>
          <span class="badge" id="model-usage-count">0</span>
        </div>
        <div id="model-chart-wrap" class="chart-wrap" style="display:none">
          <img id="model-chart" class="chart-img" alt="Usage by model chart">
        </div>
        <div id="model-usage-list" class="keys-list"></div>
      </div>

      <!-- API Keys -->
      <div class="card">
        <div class="card-header">
          <span class="card-label">API Keys</span>
          <span class="badge" id="keys-count">0</span>
        </div>
        <div id="keys-list" class="keys-list"></div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <a href="https://openrouter.ai/activity" target="_blank" class="link">View Activity →</a>
        <a href="https://openrouter.ai/settings/keys" target="_blank" class="link">Manage Keys →</a>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
